<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNEAK. - Shoes Gallery</title>

    <!-- Google Fonts : Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="style.css">
    
    <!-- load the javascript file -->
    <script src="script.js" defer></script>

</head>
<body>
    <!-- BARRE DE NAVIGATION -->
    <nav class="navbar">

        <!-- Logo à gauche -->
        <div class="logo">SNEAK.</div>

        <!-- Liens de navigation au centre -->
        <ul class="nav-links">
            <li>Men</li>
            <li>Women</li>
            <li>Kids</li>
            <li class="active">Deals</li>
        </ul>

        <!-- Icônes à droite -->
        <div class="nav-icons">
            <i data-lucide="search"></i>
            <i data-lucide="shopping-bag"></i>
        </div>

    </nav>

    <!-- CONTENU PRINCIPAL -->
    <main>

        <!-- Titre de la page -->
        <h1 class="page-title">Shoes Gallery</h1>

        <!-- Zone à deux colonnes : sidebar + produits -->
        <div class="content-layout">

            <!-- ===== SIDEBAR FILTRES ===== -->
            <aside class="sidebar">

                <!-- Filtre : Tri -->
                <div class="filter-section">
                    <h3 class="filter-title">
                        Sort by
                        <i data-lucide="chevron-down"></i>
                    </h3>
                    <label class="filter-option">
                        <input type="radio" name="sort" value="low-high">
                        Price Low to High
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="sort" value="high-low">
                        Price High to Low
                    </label>
                    <label class="filter-option">
                        <input type="radio" name="sort" value="newest" checked>
                        Newest Arrivals
                    </label>
                </div>

                <!-- Filtre : Marques -->
                <div class="filter-section brands-filter">
                    <h3 class="filter-title">
                        Brands
                        <i data-lucide="chevron-down"></i>
                    </h3>
                    <label class="filter-option">
                        <input type="checkbox" value="adidas">
                        Adidas
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" value="asics">
                        Asics
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" value="converse">
                        Converse
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" value="jordan">
                        Jordan
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" value="newbalance">
                        New Balance
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" value="nike">
                        Nike
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" value="puma">
                        Puma
                    </label>
                </div>

                <!-- Filtre : Tailles -->
                <div class="filter-section sizes-filter">
                    <h3 class="filter-title">
                        Sizes
                        <i data-lucide="chevron-down"></i>
                    </h3>
                    <div class="sizes-grid"></div>
                </div>

            </aside>

            <!-- GRILLE PRODUITS -->
            <section class="products-section">

                <!-- En-tête de la grille -->
                <div class="products-header">
                    <h2>All our shoes</h2>
                    <span class="results-count" id="results-count">0 résultats</span>
                </div>

                <!-- Grille des cartes produit (remplie dynamiquement par script.js) -->
                <div class="product-grid"></div>
                <!-- Fin grille -->

            </section>

        </div>
        <!-- Fin content-layout -->

    </main>

    <!-- Initialisation des icônes Lucide -->
    <script>lucide.createIcons();</script>

</body>
</html>
